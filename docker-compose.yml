services:
  # PostgreSQL 16 + pgvector（业务数据 + 1024 维向量 + HNSW 索引）
  postgres:
    image: pgvector/pgvector:pg16
    container_name: askusst-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: askusst
    ports:
      - "5432:5432"
    volumes:
      - askusst_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d askusst"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis Stack：LangGraph checkpointer（短期会话记忆）。宿主映射到 6380
  redis:
    image: redis/redis-stack:latest
    container_name: askusst-redis
    ports:
      - "6380:6379"
    volumes:
      - askusst_redis:/data

volumes:
  askusst_pg:
  askusst_redis:
